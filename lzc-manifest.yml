name: GBabelDocUI
package: community.lazycat.app.pdf-math-translate
version: 1.1.0
min_os_version: 1.3.8
description: "Non-destructive multi-user web UI based on PDFMathTranslate-next"
license: AGPL-3.0
homepage: https://github.com/eaiu/GBabelDocUI/
author: eaiu

application:
  subdomain: gbabeldocwebui
  upstreams:
    - location: /
      backend: http://gbabeldocui:7860/

services:
  gbabeldocui:
    # eaiu/gbabeldocwebui:1.1
    image: registry.lazycat.cloud/czyt/eaiu/gbabeldocwebui:d066fcb1bdc16835
    environment:
      - PDF2ZH_WEB_UI=1
    binds:
      - /lzcapp/var/config:/root/.config/pdf2zh
      - /lzcapp/var/data:/app/data
    cpu_shares: 512
    mem_limit: 1024M

unsupported_platforms:
  - ios
  - android
  - tvos

locales:
  en:
    name: "GBabelDocUI"
    description: "Non-destructive multi-user web UI based on PDFMathTranslate-next"
  zh:
    name: "GBabelDocUI"
    description: "基于 PDFMathTranslate-next 开发的非破坏式多用户 Web UI"
