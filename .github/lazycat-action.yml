version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/gbabeldocui.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: gbabeldocui
build:
  run_buildscript: false
images:
  - id: gbabeldocui
    target: service
    service: gbabeldocui
    source: eaiu/gbabeldocwebui
    channel: custom
    sort: semver
    tag_regex: '^\d+\.\d+$'
    version_regex: '^(?P<version>\d+\.\d+)$'
    version_template: '{version}.0'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: GBabelDocUI
    summary: "Non-destructive multi-user web UI based on PDFMathTranslate-next"
